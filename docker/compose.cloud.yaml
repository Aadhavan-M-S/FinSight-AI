services:
  backend:
    build:
      secrets: [proxy_ca]
    secrets: [proxy_ca]
    environment:
      SSL_CERT_FILE: /run/secrets/proxy_ca
      REQUESTS_CA_BUNDLE: /run/secrets/proxy_ca
  frontend:
    build:
      secrets: [proxy_ca]
secrets:
  proxy_ca:
    file: /etc/ssl/certs/ca-certificates.crt

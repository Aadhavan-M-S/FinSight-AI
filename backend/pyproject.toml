[project]
name = "finsight-ai"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "pymupdf>=1.25,<2",
  "pdfplumber>=0.11,<1",
  "pandas>=2.2,<4",
  "rank-bm25>=0.2.2,<1",
  "groq>=0.28,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
neural = ["torch>=2.6,<3", "sentence-transformers>=4,<6", "faiss-cpu>=1.10,<2"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 108

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
